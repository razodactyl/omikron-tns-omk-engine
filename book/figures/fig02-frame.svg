<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="12" y="60" width="98" height="96" rx="6" fill="#f2f2f4" stroke="#1d1d1f" stroke-width="1.3"/><text x="61" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">Win32 idle</text><text x="61" y="112.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the message pump</text><text x="61" y="128.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">has nothing to do</text><rect x="122" y="60" width="98" height="96" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="171" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">the clock</text><text x="171" y="112.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">dt = 30 / fps</text><text x="171" y="128.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">capped at 3.0</text><line x1="110" y1="108" x2="121" y2="108" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><rect x="232" y="60" width="98" height="96" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="281" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">input</text><text x="281" y="112.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">14 bits:</text><text x="281" y="128.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the keys, bound</text><line x1="220" y1="108" x2="231" y2="108" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><rect x="342" y="60" width="98" height="96" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="391" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">scripts</text><text x="391" y="112.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">every live context</text><text x="391" y="128.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">runs until it parks</text><line x1="330" y1="108" x2="341" y2="108" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><rect x="452" y="60" width="98" height="96" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="501" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">bodies</text><text x="501" y="112.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">state graphs,</text><text x="501" y="128.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the walker, the crowd</text><line x1="440" y1="108" x2="451" y2="108" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><rect x="562" y="60" width="98" height="96" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="611" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">scene</text><text x="611" y="112.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">objects' programs,</text><text x="611" y="128.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">paths, the camera</text><line x1="550" y1="108" x2="561" y2="108" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><rect x="672" y="60" width="98" height="96" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="721" y="96" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">draw</text><text x="721" y="112.2" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">visible set -&gt;</text><text x="721" y="128.4" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">bucket keys -&gt; D3D</text><line x1="660" y1="108" x2="671" y2="108" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><path d="M 721 156 C 721 260, 61 260, 61 158" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/><text x="390" y="285" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f" font-style="italic">one frame - then the pump idles again; at 30 fps each tick is exactly 1.0 of the game's clock</text><text x="390" y="30" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">One frame of the original engine (Game_RunLoop -&gt; Game_Frame)</text></svg>