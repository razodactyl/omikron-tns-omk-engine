<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><text x="380" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">How a script waits: it parks, and something else wakes it</text><rect x="30" y="110" width="150" height="70" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="105" y="140.775" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">status 1</text><text x="105" y="158.325" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">running</text><rect x="300" y="50" width="190" height="190" rx="6" fill="#fdecec" stroke="#1d1d1f" stroke-width="1.3"/><text x="395" y="108.7" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">parked</text><text x="395" y="124.9" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">status 3  a fight</text><text x="395" y="141.1" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">status 4  a scene object</text><text x="395" y="157.3" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">status 6  a screen</text><text x="395" y="173.5" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">status 7  a camera move</text><text x="395" y="189.7" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">status 8-11  a transition</text><rect x="590" y="110" width="150" height="70" rx="6" fill="#f2f2f4" stroke="#1d1d1f" stroke-width="1.3"/><text x="665" y="140.775" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">the event</text><text x="665" y="158.325" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">that answers</text><line x1="180" y1="130" x2="298" y2="110" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><text x="239" y="112" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">a handler writes</text><line x1="490" y1="145" x2="588" y2="145" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><path d="M 665 180 C 665 280, 105 280, 105 182" fill="none" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><text x="380" y="272" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f" font-style="italic">writes 1 back: the script carries on at the next instruction, stack intact</text></svg>