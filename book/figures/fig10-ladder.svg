<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><text x="380" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">How much a green check means: the six tiers (docs/PORTING.md B1)</text><rect x="40" y="50" width="8" height="42" fill="#2e8b57" stroke="none"/><rect x="56" y="50" width="250" height="42" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.3"/><text x="66" y="75.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d1d1f">1  exact</text><text x="320" y="76" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">byte-identical to the shipped data</text><rect x="40" y="102" width="8" height="42" fill="#2e8b57" stroke="none"/><rect x="56" y="102" width="250" height="42" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.3"/><text x="66" y="127.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d1d1f">2  corpus-constrained</text><text x="320" y="128" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">an invariant the shipped data could fail</text><rect x="40" y="154" width="8" height="42" fill="#b7791f" stroke="none"/><rect x="56" y="154" width="250" height="42" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.3"/><text x="66" y="179.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d1d1f">3  differential</text><text x="320" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">agrees with a second implementation</text><rect x="40" y="206" width="8" height="42" fill="#2e8b57" stroke="none"/><rect x="56" y="206" width="250" height="42" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.3"/><text x="66" y="231.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d1d1f">4  behavioural</text><text x="320" y="232" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">reproduces the original engine's own output</text><rect x="40" y="258" width="8" height="42" fill="#b7791f" stroke="none"/><rect x="56" y="258" width="250" height="42" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.3"/><text x="66" y="283.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d1d1f">5  data-constrained</text><text x="320" y="284" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">only the data it reads is checkable</text><rect x="40" y="310" width="8" height="42" fill="#c0392b" stroke="none"/><rect x="56" y="310" width="250" height="42" rx="6" fill="#fff" stroke="#1d1d1f" stroke-width="1.3"/><text x="66" y="335.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d1d1f">6  read and explained</text><text x="320" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">a transcription, internally consistent</text><text x="380" y="368" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f" font-style="italic">only tiers 1, 2 and 4 can catch a wrong reading applied consistently</text></svg>