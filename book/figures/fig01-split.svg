<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><rect x="20" y="30" width="330" height="240" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="185" y="101.9" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">Runtime.exe  (~985 KB)</text><text x="185" y="119.45" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">THE MACHINE</text><text x="185" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f"></text><text x="185" y="154.55" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">a bytecode interpreter (153 opcodes)</text><text x="185" y="172.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">a state-graph runner for bodies</text><text x="185" y="189.65" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">a renderer, a sound bank, a UI layer</text><text x="185" y="207.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">a reader for each file format</text><rect x="410" y="30" width="330" height="240" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="575" y="101.9" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">gamedata/  (~1.7 GB, 2 812 files)</text><text x="575" y="119.45" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">THE CONTENT</text><text x="575" y="137" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f"></text><text x="575" y="154.55" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">5 785 world scripts</text><text x="575" y="172.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the state graphs (.CTL), the clips</text><text x="575" y="189.65" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">sets, characters, textures</text><text x="575" y="207.2" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">conversations, voices, music</text><line x1="350" y1="150" x2="408" y2="150" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><text x="379" y="142" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">reads</text></svg>