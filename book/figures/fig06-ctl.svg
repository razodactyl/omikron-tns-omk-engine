<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><text x="380" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">A body is a state graph that shipped on the disc (.CTL)</text><rect x="40" y="130" width="130" height="56" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="105" y="153.775" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">H_STAND</text><text x="105" y="171.325" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">standing</text><rect x="300" y="60" width="130" height="56" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="365" y="92.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">walk</text><rect x="560" y="60" width="130" height="56" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="625" y="92.55" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">run</text><line x1="170" y1="145" x2="298" y2="95" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><text x="234" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">forward</text><line x1="430" y1="88" x2="558" y2="88" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><text x="494" y="80" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">forward + run</text><path d="M 300 105 C 250 150, 220 160, 172 162" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/><text x="238" y="180" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">released</text><rect x="200" y="214" width="96" height="50" rx="6" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="248" y="235.425" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d1d1f">H_ADJSTP</text><text x="248" y="250.275" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">step in</text><rect x="312" y="214" width="96" height="50" rx="6" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="360" y="235.425" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d1d1f">H_TAK*12</text><text x="360" y="250.275" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">reach</text><line x1="296" y1="239" x2="311" y2="239" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><rect x="424" y="214" width="96" height="50" rx="6" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="472" y="235.425" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d1d1f">H_TAK*22</text><text x="472" y="250.275" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">stand up</text><line x1="408" y1="239" x2="423" y2="239" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><rect x="536" y="214" width="96" height="50" rx="6" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="584" y="235.425" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d1d1f">H_WAITOB</text><text x="584" y="250.275" font-family="Helvetica, Arial, sans-serif" 