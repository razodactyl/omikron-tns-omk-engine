<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><text x="390" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">Where each part of the game lives</text><rect x="12" y="48" width="190" height="32" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="107" y="68.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">IAM/</text><text x="214" y="68" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d1d1f">archives: areas, scenes, world scripts, conversations, interface text, saves</text><rect x="600" y="48" width="168" height="32" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="684" y="67.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the VM, the world, dialogue, UI</text><rect x="12" y="88" width="190" height="32" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="107" y="108.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">MESHES/</text><text x="214" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d1d1f">.3DO models and sets, .3DT textures</text><rect x="600" y="88" width="168" height="32" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="684" y="107.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the renderer, collision</text><rect x="12" y="128" width="190" height="32" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="107" y="148.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">SCPTDATA/</text><text x="214" y="148" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d1d1f">.SCX scene scripts, .3DA clips, .3DP paths, .SFX sound tables</text><rect x="600" y="128" width="168" height="32" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="684" y="147.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">scene objects, cutscenes</text><rect x="12" y="168" width="190" height="32" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="107" y="188.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">MORPH/</text><text x="214" y="188" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d1d1f">.3DM: a line's facial animation WITH its voice</text><rect x="600" y="168" width="168" height="32" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="684" y="187.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">conversations, audio</text><rect x="12" y="208" width="190" height="32" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="107" y="228.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">.CTL / .ani</text><text x="214" y="228" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d1d1f">the bodies' state graphs and their clips</text><rect x="600" y="208" width="168" height="32" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="684" y="227.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the actor runtime</text><rect x="12" y="248" width="190" height="32" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="107" y="268.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">FONTS/ I2D/ IMAGES/ MAP2D/</text><text x="214" y="268" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d1d1f">fonts, sprite sheets, bitmaps, maps (and the gunmen's nav grid)</text><rect x="600" y="248" width="168" height="32" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="684" y="267.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the interface, shoot mode</text><rect x="12" y="288" width="190" height="32" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="107" y="308.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">TRACKS/ SOUNDS/ VOICEOFF/</text><text x="214" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d1d1f">music, effects, narration</text><rect x="600" y="288" width="168" height="32" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="684" y="307.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">the sound bank</text><rect x="12" y="328" width="190" height="32" rx="6" fill="#fdf1e3" stroke="#1d1d1f" stroke-width="1.3"/><text x="107" y="348.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d1d1f">FLIS/</text><text x="214" y="348" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="start" fill="#1d1d1f">three MPEG-1 films</text><rect x="600" y="328" width="168" height="32" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="684" y="347.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">boot</text></svg>