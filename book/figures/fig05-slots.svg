<svg xmlns="http://www.w3.org/2000/svg" width="760" height="280" viewBox="0 0 760 280"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><text x="380" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">Two places resident at once</text><rect x="30" y="50" width="320" height="180" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="190" y="109.45" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">the ACTIVE slot</text><text x="190" y="127" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">drawn</text><text x="190" y="144.55" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">its scripts and zones run</text><text x="190" y="162.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">solid</text><text x="190" y="179.65" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">e.g. the building you entered</text><rect x="410" y="50" width="320" height="180" rx="6" fill="#f2f2f4" stroke="#1d1d1f" stroke-width="1.3"/><text x="570" y="109.45" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1d1d1f">the HIDDEN slot</text><text x="570" y="127" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">not drawn</text><text x="570" y="144.55" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">still animating</text><text x="570" y="162.1" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">STILL SOLID</text><text x="570" y="179.65" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f">e.g. the street you left</text><path d="M 350 120 L 408 120" fill="none" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><path d="M 408 160 L 352 160" fill="none" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><text x="380" y="108" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">walk out</text><text x="380" y="180" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">walk back: no reload</text><text x="380" y="258" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f" font-style="italic">hidden is not unloaded - and it shares the 58-slot texture cache with the active one</text></svg>