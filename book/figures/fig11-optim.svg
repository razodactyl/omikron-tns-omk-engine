<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><text x="380" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">Two of the 2026-09-29 measurements (M3; counts, not milliseconds)</text><text x="30" y="60" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d1d1f">GL state calls a frame</text><rect x="30" y="70" width="640" height="30" fill="#c9d6ee" stroke="none"/><text x="680" y="90" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">before 1809</text><rect x="30" y="106" width="32.5484" height="30" fill="#2e8b57" stroke="none"/><text x="72.5484" y="126" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">after 92</text><text x="30" y="170" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="start" fill="#1d1d1f">heap allocations a frame*</text><rect x="30" y="180" width="640" height="30" fill="#c9d6ee" stroke="none"/><text x="680" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">before 724</text><rect x="30" y="216" width="141.436" height="30" fill="#2e8b57" stroke="none"/><text x="181.436" y="236" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="start" fill="#1d1d1f">after 160</text><text x="380" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f" font-style="italic">* outside the software reference rasterizer, which the Vita never