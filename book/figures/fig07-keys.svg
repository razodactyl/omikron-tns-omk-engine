<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340"><rect width="100%" height="100%" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1f"/></marker></defs><text x="390" y="26" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#1d1d1f">The draw order is a number: the 14-bit bucket key</text><rect x="82" y="50" width="44" height="40" rx="0" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="104" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">13</text><rect x="126" y="50" width="44" height="40" rx="0" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="148" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">12</text><rect x="170" y="50" width="44" height="40" rx="0" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="192" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">11</text><rect x="214" y="50" width="44" height="40" rx="0" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="236" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">10</text><rect x="258" y="50" width="44" height="40" rx="0" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="280" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">9</text><rect x="302" y="50" width="44" height="40" rx="0" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="324" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">8</text><rect x="346" y="50" width="44" height="40" rx="0" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="368" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">7</text><rect x="390" y="50" width="44" height="40" rx="0" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="412" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">6</text><rect x="434" y="50" width="44" height="40" rx="0" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="456" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">5</text><rect x="478" y="50" width="44" height="40" rx="0" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="500" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">4</text><rect x="522" y="50" width="44" height="40" rx="0" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="544" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">3</text><rect x="566" y="50" width="44" height="40" rx="0" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="588" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">2</text><rect x="610" y="50" width="44" height="40" rx="0" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="632" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">1</text><rect x="654" y="50" width="44" height="40" rx="0" fill="#e9f6ec" stroke="#1d1d1f" stroke-width="1.3"/><text x="676" y="73.85" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">0</text><text x="258" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f">state bits, from the mesh's flags</text><text x="566" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f">texture slot (low 6 bits)</text><text x="390" y="150" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f">Render_FlushBuckets walks the keys 0 .. 0x3FFF in ASCENDING order:</text><rect x="40" y="170" width="440" height="40" rx="6" fill="#e8eefc" stroke="#1d1d1f" stroke-width="1.3"/><text x="260" y="194.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f">opaque geometry, bucket by bucket, texture by texture</text><rect x="500" y="170" width="240" height="40" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.3"/><text x="620" y="194.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d1d1f">blended: key bit 13 set</text><line x1="40" y1="230" x2="740" y2="230" stroke="#1d1d1f" stroke-width="1.5" marker-end="url(#ar)"/><text x="390" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" text-anchor="middle" fill="#1d1d1f">draw order</text><text x="390" y="290" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f" font-style="italic">blended geometry lands at the top of the range, so it is drawn last - which is what transparency needs;</text><text x="390" y="308" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#1d1d1f" font-style="italic">two coincident faces in one mesh differ only in texture slot, so the lower slot is drawn first - and wins</text></svg>